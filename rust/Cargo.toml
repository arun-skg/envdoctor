[package]
name = "envdoctor"
version = "0.1.2"
edition = "2021"
description = "Local-first consistency checker for environment variables (native Rust port)"
license = "MIT"
repository = "https://github.com/arun-skg/envdoctor"
homepage = "https://arun-skg.github.io/envdoctor/"
readme = "README.md"
keywords = ["env", "dotenv", "cli", "linter", "environment-variables"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "string", "help"] }
# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
tokio = { version = "1", features = ["fs", "rt", "macros", "rt-multi-thread"] }
# File discovery
glob = "0.3"
# Parsing
dotenvy = "0.15"  # for reference, but we'll hand-roll like the TS version
yaml-rust = "0.4"
# Regex
regex = "1"
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Filesystem
walkdir = "2"
# Terminal output
colored = "2"
# Path handling
camino = { version = "1.1", features = ["serde1"] }
# Hashing for snapshots
blake3 = "1.5"
# Snapshot token codec: base64url(gzip(json))
flate2 = "1"
base64 = "0.22"
# Process for git
async-process = "1.4"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[[bin]]
name = "envdoctor"
path = "src/main.rs"

[lib]
name = "envdoctor"
path = "src/lib.rs"