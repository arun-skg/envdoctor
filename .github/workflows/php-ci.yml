name: PHP CI

on:
  push:
    paths:
      - "php/**"
      - ".github/workflows/php-ci.yml"
  pull_request:
    paths:
      - "php/**"
      - ".github/workflows/php-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - run: composer validate --strict
      - run: php tests/ScannerTest.php
