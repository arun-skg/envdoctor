# Publishes the Java artifact to Maven Central on a `java-v*` tag.
#
# One-time setup (https://central.sonatype.com):
#   1. Register and verify the `io.github.arun-skg` namespace (GitHub ownership).
#   2. Generate a user token (username + password) for Central.
#   3. Create a GPG key, publish the public key to a keyserver.
#
# Required secrets:
#   CENTRAL_USERNAME        — Central portal token username
#   CENTRAL_PASSWORD        — Central portal token password
#   MAVEN_GPG_PRIVATE_KEY   — base64 of the ASCII-armored private key, single line:
#                             gpg --armor --export-secret-keys KEYID | base64 | tr -d '\n'
#   MAVEN_GPG_PASSPHRASE    — passphrase for that key
name: Java Release

on:
  push:
    tags:
      - "java-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      # setup-java writes ~/.m2/settings.xml with the Central server credentials.
      # GPG is imported manually below (setup-java's built-in import is flaky).
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Import GPG key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          echo "$MAVEN_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long
          # Allow the agent to accept a preset passphrase, then cache it so
          # maven-gpg-plugin never has to prompt (avoids "Bad passphrase" from
          # shell/property interpolation of the secret).
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          # Strip any stray whitespace/newline the secret may carry.
          printf '%s' "$MAVEN_GPG_PASSPHRASE" | tr -d '\r\n' > /tmp/gpg_pass
          KEYGRIP=$(gpg --batch --with-colons --with-keygrip --list-secret-keys \
            | awk -F: '/^grp:/{print $10; exit}')
          echo "keygrip=$KEYGRIP"
          /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "$(cat /tmp/gpg_pass)" "$KEYGRIP" \
            || echo "preset unavailable; falling back to -Dgpg.passphrase"
          # Verify signing actually works before attempting the deploy.
          echo test > /tmp/sigtest.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file /tmp/gpg_pass \
            --detach-sign /tmp/sigtest.txt && echo "SIGNING OK"
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy "-Dgpg.passphraseServerId=gpg" "-Dgpg.passphrase=$(cat /tmp/gpg_pass)"
