# Publishes the Java artifact to Maven Central on a `java-v*` tag.
#
# One-time setup (https://central.sonatype.com):
#   1. Register and verify the `io.github.arun-skg` namespace (GitHub ownership).
#   2. Generate a user token (username + password) for Central.
#   3. Create a GPG key, publish the public key to a keyserver.
#
# Required secrets:
#   CENTRAL_USERNAME        — Central portal token username
#   CENTRAL_PASSWORD        — Central portal token password
#   MAVEN_GPG_PRIVATE_KEY   — ASCII-armored private key (gpg --armor --export-secret-keys)
#   MAVEN_GPG_PASSPHRASE    — passphrase for that key
name: Java Release

on:
  push:
    tags:
      - "java-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v5
      # setup-java writes ~/.m2/settings.xml with the Central server credentials.
      # GPG is imported manually below (setup-java's built-in import is flaky).
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Import GPG key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy "-Dgpg.passphrase=${MAVEN_GPG_PASSPHRASE}"
