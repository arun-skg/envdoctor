name: Downloads chart

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: downloads-chart
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate chart
        run: node scripts/downloads-chart.mjs downloads.svg

      # Publish only the SVG to an orphan branch, keeping `main` clean and
      # avoiding branch-protection (this repo requires PRs + checks on main).
      - name: Publish to npm-downloads branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          mv downloads.svg "$tmp/downloads.svg"
          git checkout --orphan npm-downloads
          git rm -rf --quiet . || true
          mv "$tmp/downloads.svg" downloads.svg
          printf '# npm-downloads\n\nAuto-generated download chart. Do not edit — see `.github/workflows/downloads-chart.yml`.\n' > README.md
          git add downloads.svg README.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update npm downloads chart"
          git push --force origin npm-downloads
