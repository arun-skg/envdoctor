name: Swift CI

on:
  push:
    paths:
      - "swift/**"
      - ".github/workflows/swift-ci.yml"
  pull_request:
    paths:
      - "swift/**"
      - ".github/workflows/swift-ci.yml"

jobs:
  test-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.0"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
