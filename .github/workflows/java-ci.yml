name: Java CI

on:
  push:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
      - run: mvn -B verify
