# Publishes the Kotlin artifact (io.github.arun-skg:envdoctor-kotlin) to Maven
# Central on a `kotlin-v*` tag. Mirrors java-release.yml — same Central account
# and GPG key, different artifactId.
#
# One-time setup (https://central.sonatype.com):
#   1. The `io.github.arun-skg` namespace is already verified for the Java port;
#      no extra namespace step is needed.
#   2. Reuses the same secrets as the Java release (see below).
#
# Required secrets (shared with java-release.yml):
#   CENTRAL_USERNAME        — Central portal token username
#   CENTRAL_PASSWORD        — Central portal token password
#   MAVEN_GPG_PRIVATE_KEY   — base64 of the ASCII-armored private key, single line:
#                             gpg --armor --export-secret-keys KEYID | base64 | tr -d '\n'
#   MAVEN_GPG_PASSPHRASE    — passphrase for that key
#
# Before tagging: bump <version> in kotlin/pom.xml, then
#   git tag kotlin-v1.0.0 && git push origin kotlin-v1.0.0
name: Kotlin Release

on:
  push:
    tags:
      - "kotlin-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Import GPG key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          echo "$MAVEN_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          printf '%s' "$MAVEN_GPG_PASSPHRASE" | tr -d '\r\n' > /tmp/gpg_pass
          KEYGRIP=$(gpg --batch --with-colons --with-keygrip --list-secret-keys \
            | awk -F: '/^grp:/{print $10; exit}')
          echo "keygrip=$KEYGRIP"
          /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "$(cat /tmp/gpg_pass)" "$KEYGRIP" \
            || echo "preset unavailable; falling back to -Dgpg.passphrase"
          echo test > /tmp/sigtest.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file /tmp/gpg_pass \
            --detach-sign /tmp/sigtest.txt && echo "SIGNING OK"
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy "-Dgpg.passphraseServerId=gpg" "-Dgpg.passphrase=$(cat /tmp/gpg_pass)"
