name: .NET CI

on:
  push:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test
      - name: Pack (release)
        run: dotnet pack -c Release
