name: envdoctor
description: >-
  Local-first environment-variable consistency checker. Native Dart port of
  envdoctor: detects missing, unused, duplicate, and mismatched variables
  across .env files, docker-compose, GitHub Actions, Kubernetes manifests,
  and source code.
version: 0.1.2
repository: https://github.com/arun-skg/envdoctor

environment:
  sdk: ^3.13.0

dependencies:
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.26.0
  lints: ^6.0.0

executables:
  envdoctor: bin/envdoctor.dart
